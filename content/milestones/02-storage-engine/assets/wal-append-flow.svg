<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
  <defs>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ade80"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" fill="#0f172a" rx="8"/>

  <!-- Application Box -->
  <rect x="30" y="40" width="160" height="160" rx="6" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <text x="110" y="68" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="14" font-weight="bold">Application</text>
  <text x="110" y="100" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">Put("name","Alice")</text>
  <text x="110" y="120" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">Put("age","30")</text>
  <text x="110" y="140" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">Delete("name")</text>

  <!-- WAL File Box -->
  <rect x="250" y="40" width="220" height="260" rx="6" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="68" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="14" font-weight="bold">WAL File</text>

  <!-- WAL Records -->
  <rect x="265" y="85" width="190" height="28" rx="3" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
  <text x="360" y="104" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="10">PUT|4|5|name|Alice</text>

  <rect x="265" y="120" width="190" height="28" rx="3" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
  <text x="360" y="139" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="10">PUT|3|2|age|30</text>

  <rect x="265" y="155" width="190" height="28" rx="3" fill="#1e293b" stroke="#f87171" stroke-width="1"/>
  <text x="360" y="174" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="10">DEL|4|0|name|</text>

  <!-- Append arrow indicator -->
  <text x="360" y="210" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="11">↓ append here</text>

  <!-- Byte format detail -->
  <text x="360" y="240" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">[op:1][keyLen:4][valLen:4][key][val]</text>

  <!-- In-Memory Map Box -->
  <rect x="530" y="40" width="160" height="160" rx="6" fill="none" stroke="#4ade80" stroke-width="2"/>
  <text x="610" y="68" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="14" font-weight="bold">In-Memory Map</text>
  <text x="610" y="100" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" text-decoration="line-through">name → Alice</text>
  <text x="610" y="125" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">age → 30</text>
  <text x="610" y="160" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">(after replay)</text>

  <!-- Arrows: App → WAL -->
  <line x1="190" y1="110" x2="248" y2="110" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="219" y="103" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="9">1. write</text>

  <!-- Arrows: App → Map -->
  <line x1="190" y1="150" x2="280" y2="230" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="280" y1="230" x2="528" y2="120" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="4"/>
  <text x="350" y="275" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="9">2. update map</text>

  <!-- Legend -->
  <rect x="30" y="340" width="660" height="45" rx="4" fill="#1e293b"/>
  <text x="360" y="362" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12">Append-only: new entries always added to the end. Never overwrite.</text>
  <text x="360" y="378" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">PUT = 0x01  |  DEL = 0x02  |  Sync after every write for durability</text>
</svg>
