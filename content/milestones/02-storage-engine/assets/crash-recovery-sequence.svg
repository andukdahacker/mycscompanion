<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
  <defs>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ade80"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" fill="#0f172a" rx="8"/>

  <!-- Timeline bar -->
  <line x1="40" y1="50" x2="680" y2="50" stroke="#475569" stroke-width="2"/>

  <!-- Phase 1: Normal Writes -->
  <rect x="40" y="30" width="150" height="10" fill="#4ade80" rx="2"/>
  <text x="115" y="20" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">1. Normal Writes</text>

  <!-- Phase 1 detail -->
  <rect x="45" y="70" width="140" height="100" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
  <text x="115" y="90" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="10">Put("a","1")</text>
  <text x="115" y="108" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="10">Put("b","2")</text>
  <text x="115" y="126" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="10">Put("c","3")</text>
  <line x1="115" y1="135" x2="115" y2="155" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="115" y="163" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="9">WAL + Memory</text>

  <!-- Phase 2: Crash -->
  <rect x="210" y="30" width="120" height="10" fill="#f87171" rx="2"/>
  <text x="270" y="20" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="11" font-weight="bold">2. CRASH!</text>

  <!-- Crash detail -->
  <rect x="215" y="70" width="110" height="100" rx="4" fill="#1e293b" stroke="#f87171" stroke-width="1"/>
  <text x="270" y="95" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="22">✕</text>
  <text x="270" y="118" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="9">Memory lost!</text>
  <text x="270" y="135" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="9">WAL survives</text>
  <text x="270" y="150" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="9">on disk ✓</text>

  <!-- Phase 3: Restart -->
  <rect x="350" y="30" width="130" height="10" fill="#f59e0b" rx="2"/>
  <text x="415" y="20" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">3. Restart</text>

  <!-- Restart detail -->
  <rect x="355" y="70" width="120" height="100" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="415" y="95" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="10">New process</text>
  <text x="415" y="115" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="10">starts</text>
  <text x="415" y="140" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">Memory: empty</text>
  <text x="415" y="155" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="9">WAL: intact</text>

  <!-- Phase 4: Replay -->
  <rect x="500" y="30" width="180" height="10" fill="#a78bfa" rx="2"/>
  <text x="590" y="20" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="bold">4. Replay WAL</text>

  <!-- Replay detail -->
  <rect x="505" y="70" width="170" height="130" rx="4" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
  <text x="590" y="92" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10">Read WAL entry by entry:</text>
  <text x="590" y="112" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="10">PUT a=1 → map[a]=1</text>
  <text x="590" y="130" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="10">PUT b=2 → map[b]=2</text>
  <text x="590" y="148" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="10">PUT c=3 → map[c]=3</text>
  <line x1="590" y1="158" x2="590" y2="178" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="590" y="190" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="10">All data recovered!</text>

  <!-- WAL on disk illustration -->
  <rect x="40" y="220" width="640" height="55" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="360" y="240" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">WAL File on Disk (survives crashes)</text>
  <text x="360" y="260" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="10">[PUT|a|1] → [PUT|b|2] → [PUT|c|3]  (each entry fsync'd immediately)</text>

  <!-- Key insight -->
  <rect x="100" y="300" width="520" height="40" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="360" y="325" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="13" font-weight="bold">Memory is volatile. The WAL is the source of truth.</text>

  <!-- Legend -->
  <rect x="40" y="360" width="640" height="30" rx="4" fill="#1e293b"/>
  <circle cx="70" cy="375" r="5" fill="#4ade80"/><text x="85" y="379" fill="#94a3b8" font-family="monospace" font-size="10">Write</text>
  <circle cx="160" cy="375" r="5" fill="#f87171"/><text x="175" y="379" fill="#94a3b8" font-family="monospace" font-size="10">Crash</text>
  <circle cx="245" cy="375" r="5" fill="#f59e0b"/><text x="260" y="379" fill="#94a3b8" font-family="monospace" font-size="10">Restart</text>
  <circle cx="345" cy="375" r="5" fill="#a78bfa"/><text x="360" y="379" fill="#94a3b8" font-family="monospace" font-size="10">Replay</text>
  <circle cx="435" cy="375" r="5" fill="#22d3ee"/><text x="450" y="379" fill="#94a3b8" font-family="monospace" font-size="10">Insight</text>
</svg>
