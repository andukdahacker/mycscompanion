app = "mcc-execution"
primary_region = "sin"

[build]
dockerfile = "Dockerfile"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
path = "/health"
interval = 15000
timeout = 5000
grace_period = "10s"

[[vm]]
cpu_kind = "shared"
cpus = 4
memory_mb = 1024
