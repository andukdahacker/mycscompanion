# REQUIRED REPOSITORY SETTINGS:
# ==============================
# 1. Branch protection rule on 'main':
#    - Require status checks to pass: "ci" and "e2e" jobs
#    - Require branches to be up to date before merging
#    - Require pull request reviews (optional but recommended)
# 2. GitHub Secrets:
#    - TURBO_TOKEN (optional): Vercel Turborepo remote cache token
# 3. GitHub Variables:
#    - TURBO_TEAM (optional): Vercel team slug for remote caching
#
# TURBOREPO REMOTE CACHING SETUP (optional):
# 1. Create a Vercel account (free tier)
# 2. Generate a Turborepo token at https://vercel.com/account/tokens
# 3. Add TURBO_TOKEN as a GitHub repository secret
# 4. Add TURBO_TEAM as a GitHub repository variable (the Vercel team slug)
# Turborepo automatically detects these env vars and enables remote caching.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mycscompanion
          POSTGRES_PASSWORD: mycscompanion
          POSTGRES_DB: mycscompanion
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://mycscompanion:mycscompanion@localhost:5432/mycscompanion
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      LOG_LEVEL: silent
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate no-red colors (UX-19)
        run: ./scripts/validate-no-red.sh

      - name: Validate primary action uniqueness (UX-19)
        run: ./scripts/validate-primary-action.sh

      - name: Lighthouse CI
        run: pnpm --filter website lighthouse

  # e2e:
  #   runs-on: ubuntu-latest
  #   needs: [ci]
  #   # TODO: Re-enable once Firebase and other secrets are configured
  #   # Requires: FIREBASE_SERVICE_ACCOUNT, ANTHROPIC_API_KEY, etc.
