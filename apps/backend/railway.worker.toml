# Worker service — separate Railway service pointing to same repo
# Configure in Railway dashboard: root directory = apps/backend
[build]
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @mycscompanion/shared build && pnpm --filter @mycscompanion/execution build && pnpm --filter @mycscompanion/backend build"

[deploy]
startCommand = "cd apps/backend && node --import ./dist/instrument.js dist/worker/worker.js"
