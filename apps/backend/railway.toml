[build]
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @mycscompanion/shared build && pnpm --filter @mycscompanion/execution build && pnpm --filter @mycscompanion/backend build"

[deploy]
startCommand = "cd apps/backend && node --import ./dist/instrument.js dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
preDeployCommand = "cd apps/backend && pnpm db:migrate"
